<!DOCTYPE html>
<html lang="es">

<head>

        content="Aerografia79: arte con alma, técnica con corazón. Pintura artística, retratos, llantas y más." />

        content="Arte con alma, técnica con corazón. Servicios de pintura artística y personalizados." />

    <title>Página en proceso de creación - Galería de Trabajos</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<body>
    <div class="barra-superior">
        <button class="menu-toggle" aria-label="Abrir menú">
            <span class="hamburguesa"></span>
            <span class="hamburguesa"></span>
            <span class="hamburguesa"></span>
            <span class="texto-menu">Menú</span>
        </button>

        <div class="redes-sociales">
            <a href="https://www.instagram.com/aerografia79/" target="_blank" aria-label="Instagram">
                <i class="fab fa-instagram"></i>

        </div>
    </div>

    <div class="presentacion">
        <h1>Bienvenido a Aerografia79</h1>
        <p>Arte con alma, técnica con corazón</p>

    <div class="contenedor">

        <div class="grupo-caja">
            <div class="caja">
                <img src="img/flor rosa.webp" alt="Pintado de Retratos" loading="lazy" />

        </div>
        <div class="grupo-caja">
            <div class="caja">
                <img src="img/cascos.webp" alt="Cascos de moto personalizados" loading="lazy" />

            <p class="titulo-caja">Pintado de Cascos</p>
        </div>
        <div class="grupo-caja">
            <div class="caja">
                <img src="img/faros.webp" alt="Lacado de faros" loading="lazy" />
            </div>
            <p class="titulo-caja">Lacado de Faros</p>
        </div>
        <div class="grupo-caja">
            <div class="caja">
                <img src="img/llantas.webp" alt="Pintado de Llantas de coche" loading="lazy" />
            </div>
            <p class="titulo-caja">Pintado de Llantas</p>
